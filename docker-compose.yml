

services:
  cardioscan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardioscan-pro
    ports:
      - "8501:8501"
    volumes:
      # Mount the production folder so code changes reflect immediately
      - ./production:/app/production
      - ./generated_ecgs:/app/generated_ecgs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
